<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Ebook Template</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fafaf9; /* Nền Off-white (Trắng ngà) sang trọng */
            color: #1e293b;
            line-height: 2.2;
            letter-spacing: 0.015em;
            font-size: 1.05rem;
            width: 210mm;
            margin: 0 auto;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif;
            color: #0f172a;
        }

        /* H1: Mặc định (nếu còn sót lại) */
        h1 { 
            font-size: 3rem; 
            font-weight: 800; 
            margin-bottom: 2rem; 
            line-height: 1.2; 
            color: #0f172a;
        }

        /* --- COVER PAGE --- */
        .cover-page {
            width: 100%;
            height: 100vh;
            page-break-after: always;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0f172a;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 4rem;
        }

        /* Abstract Cover Graphics */
        .cover-page::before {
            content: '';
            position: absolute;
            top: -20%; right: -20%;
            width: 80%; height: 80%;
            background: radial-gradient(circle, rgba(212,175,55,0.15) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
        }
        .cover-page::after {
            content: '';
            position: absolute;
            bottom: -20%; left: -20%;
            width: 80%; height: 80%;
            background: radial-gradient(circle, rgba(212,175,55,0.1) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
        }
        
        .cover-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(212,175,55,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212,175,55,0.05) 1px, transparent 1px);
            background-size: 80px 80px;
            z-index: 0;
            opacity: 0.6;
        }

        /* Gold frames */
        .cover-frame {
            position: absolute;
            top: 40px; bottom: 40px; left: 40px; right: 40px;
            border: 2px solid rgba(212,175,55,0.3);
            z-index: 1;
            pointer-events: none;
        }
        .cover-frame::before {
            content: ''; position: absolute;
            top: -2px; left: 20%; width: 60%; height: 4px;
            background: #0f172a;
        }
        .cover-frame::after {
            content: ''; position: absolute;
            bottom: -2px; left: 20%; width: 60%; height: 4px;
            background: #0f172a;
        }

        .cover-content {
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .cover-brand {
            font-family: 'Inter', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 0.5em;
            color: #d4af37;
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 4rem;
        }

        .cover-title {
            font-family: 'Playfair Display', serif;
            font-size: 4.5rem;
            font-weight: 800;
            line-height: 1.1;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 95%;
            margin-bottom: 2rem;
        }

        .cover-subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 1.6rem;
            font-weight: 500;
            line-height: 1.6;
            color: #cbd5e1;
            max-width: 80%;
            margin-bottom: 4rem;
        }

        .cover-divider {
            width: 120px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin-bottom: 4rem;
        }

        .cover-footer {
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.35em;
            color: rgba(212,175,55,0.7);
            text-transform: uppercase;
            font-weight: 600;
        }

        /* --- TITLE PAGE --- */
        .title-page {
            width: 100%;
            min-height: 100vh;
            page-break-after: always;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            position: relative;
            box-sizing: border-box;
            padding: 4rem;
        }
        
        /* Viền trang trí cho Title Page */
        .title-page::before {
            content: '';
            position: absolute;
            top: 25px; bottom: 25px; left: 25px; right: 25px;
            border: 2px solid rgba(212, 175, 55, 0.3); /* Gold border */
            pointer-events: none;
        }
        .title-page::after {
            content: '';
            position: absolute;
            top: 35px; bottom: 35px; left: 35px; right: 35px;
            border: 1px solid rgba(212, 175, 55, 0.15); /* Inner thin gold border */
            pointer-events: none;
        }

        .title-page-eyebrow {
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 0.4em;
            color: #d4af37;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 3rem;
        }

        .title-page-text {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 800;
            line-height: 1.2;
            color: #0f172a;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            max-width: 90%;
            margin-bottom: 2rem;
        }

        .title-page-subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 1.4rem;
            font-weight: 600;
            line-height: 1.5;
            color: #d4af37;
            text-align: center;
            max-width: 80%;
            margin-bottom: 3.5rem;
            padding: 1rem 2rem;
            background: linear-gradient(90deg, transparent 0%, rgba(212,175,55,0.05) 50%, transparent 100%);
            border-top: 1px solid rgba(212,175,55,0.15);
            border-bottom: 1px solid rgba(212,175,55,0.15);
        }

        .title-page-divider {
            width: 80px;
            height: 4px;
            background: #d4af37;
            margin-bottom: 4rem;
        }

        .title-page-footer {
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.25em;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 500;
        }
        
        /* H2: Slide Divider (Cắt cảnh Chương) - Đứng độc lập 1 trang */
        h2 { 
            page-break-before: always;
            page-break-after: always;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin: 0;
            padding: 0;
            background: #0f172a;
            position: relative;
            overflow: hidden;
            /* Full page height */
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Viền trên: Dải gradient Vàng Gold */
        h2::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, transparent 0%, #d4af37 20%, #f5e6a3 50%, #d4af37 80%, transparent 100%);
        }

        /* Viền dưới: Dải gradient Vàng Gold */
        h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, transparent 0%, #d4af37 20%, #f5e6a3 50%, #d4af37 80%, transparent 100%);
        }

        /* H3: Tiêu đề Slide (Slide Title) */
        h3 { 
            font-size: 1.8rem; 
            font-weight: 700; 
            margin-top: 3.5rem; 
            margin-bottom: 2rem; 
            padding-bottom: 0.75rem;
            border-bottom: 3px solid #d4af37; /* Gạch dưới vàng gold */
            color: #0f172a;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            page-break-after: avoid; 
        }
        
        /* Paragraph Styling */
        p { 
            margin-bottom: 1.5rem; 
            text-align: justify; 
            hyphens: auto; 
            orphans: 2;
            widows: 2;
        }

        /* Data Highlighting: Inline Code */
        code {
            background-color: #0f172a; 
            color: #d4af37; 
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 1.1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        /* Blockquotes: Glassmorphism Card Style */
        blockquote {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border-left: 8px solid #d4af37;
            border-radius: 16px;
            padding: 2rem 2.5rem;
            margin: 3.5rem 0;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.35rem;
            line-height: 1.9;
            color: #1e293b;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.05), 0 8px 10px -6px rgb(0 0 0 / 0.01);
            position: relative;
        }
        
        /* Dấu ngoặc kép mờ sau lưng */
        blockquote::before {
            content: '"';
            position: absolute;
            top: -10px;
            left: 20px;
            font-size: 6rem;
            color: rgba(212, 175, 55, 0.1); /* Vàng mờ */
            font-family: serif;
        }

        blockquote p:last-child {
            margin-bottom: 0;
        }

        /* Sửa lỗi Mindmap */
        .custom-diagram {
            page-break-inside: avoid !important;
            break-inside: avoid !important;
            margin: 4rem 0 !important;
            zoom: 0.85; 
            background: white !important; /* Làm nổi sơ đồ trên nền Off-white */
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.05) !important;
        }

        /* Table Styling - Financial Report Grade */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin: 3.5rem 0;
            background-color: #fff;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.05);
            border-radius: 12px;
            overflow: hidden;
            zoom: 0.9;
        }
        tr {
            page-break-inside: avoid;
        }
        th {
            background-color: #0f172a;
            color: #d4af37; /* Gold accent */
            text-align: left;
            padding: 1.5rem 1.25rem;
            font-family: 'Inter', sans-serif;
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        td {
            padding: 1.25rem 1.25rem;
            border-bottom: 1px solid #e2e8f0;
            color: #334155;
            vertical-align: top;
            font-size: 1.05rem;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:nth-child(even) td {
            background-color: #f8fafc;
        }
        /* Nhấn mạnh cột đầu tiên */
        td:first-child {
            font-weight: 600;
            color: #0f172a;
        }

        hr {
            margin: 3rem 0;
            border: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, #d4af37, transparent);
        }

        /* Lists */
        ul, ol {
            margin-bottom: 1.5rem;
            padding-left: 2rem;
        }
        li {
            margin-bottom: 0.5rem;
        }

        /* Page break utilities */
        .page-break-before { page-break-before: always; }
        .page-break-after { page-break-after: always; }
        
        /* Markdown generated images */
        .content-page img {
            max-width: 100%;
            border-radius: 0.5rem;
            margin: 2rem 0;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

    </style>
</head>
<body>
    
    <div class="cover-page">
        <img src="{{COVER_IMAGE}}" alt="Cover" class="cover-image" />
    </div>

    <div class="content-page">
        <!-- Content will be injected here -->
        {{CONTENT}}
    </div>

</body>
</html>
